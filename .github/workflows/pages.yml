name: Deploy site and refresh Steam data

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
    inputs:
      refresh_data:
        description: Refresh Steam data before deploying
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Refresh the rolling 90-day Steam database
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data)
        env:
          STEAM_USER_AGENT: steam-signal/1.0 (weekly personal research dashboard)
        run: >-
          python scripts/steam_recent_games.py
          --database data/steam_recent_games.sqlite3
          --days 90
          --delay 0.65
          --search-delay 1.5

      - name: Export browser-readable data
        run: python scripts/export_steam_data.py

      - name: Commit refreshed data
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/steam_recent_games.sqlite3 data/steam_games.json
          if ! git diff --cached --quiet; then
            git commit -m "refresh weekly Steam data"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Assemble static site
        run: |
          mkdir _site
          cp index.html styles.css site.js .nojekyll _site/
          cp -R assets games steam-signal data _site/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
